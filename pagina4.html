<body>
<div id="banner" hidden>Candidatura inviata</div>
<main>
  <p class="step">Pagina 4 di 4</p>
  <h1>PIATTAFORMA BANDI</h1>
  <p class="sub">pixel con evento Lead appena si preme il tasto Invia</p>

  <form id="modulo" novalidate>
    <label>Nome<input type="text" name="nome" placeholder="Mario"></label>
    <label>Cognome<input type="text" name="cognome" placeholder="Rossi"></label>
    <label>Email<input type="email" name="email" placeholder="mario.rossi@email.it"></label>
    <label>Telefono<input type="tel" name="telefono" placeholder="333 1234567"></label>
    <button type="submit">Invia</button>
  </form>
</main>
<p class="nota">ID pixel di esempio: l'avviso del plugin sull'ID non valido è normale, gli eventi vengono comunque rilevati.</p>
<nav><a class="btn" href="pagina3.html">&larr; Indietro</a><span class="btn off">Avanti &rarr;</span></nav>

<script>
  document.getElementById('modulo').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('banner').hidden = false;
    fbq('track', 'Lead');
  });
</script>
</body>
</html>
